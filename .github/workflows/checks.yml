name: Checks

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check static files
        run: node scripts/check-static.mjs && node --test tests/*.test.mjs

      - name: Check 3D museum
        run: node museums/3d/scripts/check-wapuus.mjs && node --test museums/3d/tests/*.test.mjs

      - name: Check WordPress adapter syntax
        run: php -l museum.php
